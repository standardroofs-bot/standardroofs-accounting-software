# ==============================================================================
# Standard Roofs Books (SR-Books) - Kubernetes TLS Ingress Manifest
# Cloudflare Tunnel / Ingress Gateway with Automatic TLS Termination
# ==============================================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sr-books-ingress
  namespace: default
  labels:
    app.kubernetes.io/name: sr-books
    app.kubernetes.io/component: ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: SAMEORIGIN";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
spec:
  tls:
    - hosts:
        - books.standardroofs.com
        - erp.standardroofs.com
      secretName: sr-books-tls-secret
  rules:
    - host: books.standardroofs.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sr-books-service
                port:
                  number: 80
    - host: erp.standardroofs.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sr-books-service
                port:
                  number: 80
